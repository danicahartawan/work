[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvkit-platform"
version = "0.1.0"
description = "nvkit Control Center: web app for building and running workflows with the nvkit API agents (phone companion at /mobile.html)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
nvkit-platform = "nvkit_platform.app:main"

[tool.setuptools.package-data]
nvkit_platform = ["static/*"]
