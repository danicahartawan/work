[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvkit-core"
version = "0.1.0"
description = "Shared helpers for nvkit agent packages: credential handling and NAT compat shims"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nemo-agent-toolkit",
    "httpx>=0.27",
]
