[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvkit-wordpress"
version = "0.1.0"
description = "NAT tools for drafting posts via the WordPress REST API"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nemo-agent-toolkit",
    "nvkit-core",
    "httpx>=0.27",
]

[project.entry-points."nat.plugins.functions"]
nvkit_wordpress_create_draft = "nvkit_wordpress.register:wordpress_create_draft"

[project.entry-points."nat.components"]
nvkit_wordpress = "nvkit_wordpress.register"
