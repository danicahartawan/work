[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvkit-meltwater"
version = "0.1.0"
description = "NAT tools for media monitoring via the Meltwater API"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nemo-agent-toolkit",
    "nvkit-core",
    "httpx>=0.27",
]

[project.entry-points."nat.plugins.functions"]
nvkit_meltwater_search = "nvkit_meltwater.register:meltwater_search"

[project.entry-points."nat.components"]
nvkit_meltwater = "nvkit_meltwater.register"
