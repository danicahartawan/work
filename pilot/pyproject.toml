[project]
name = "pilot-readiness"
version = "0.1.0"
description = "Compile plain-language agent-readiness goals into runnable Harbor eval tasks."
readme = "README.md"
# Harbor itself requires 3.12+, and pilot is a companion to Harbor.
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# `pilot check` uses Harbor's own task models when available.
harbor = ["harbor>=0.17"]
dev = ["pytest>=8.0"]

[project.scripts]
pilot = "pilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot"]
